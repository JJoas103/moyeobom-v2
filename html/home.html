<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모여봄 홈</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css");
:root{--bg:#FBFAF7;--bg-muted:#F4F2EC;--surface:#FFFFFF;--line:#E6E1D7;--line-strong:#26221E;--text:#26221E;--text-body:#5E5850;--text-sub:#736D64;--text-disabled:#B8B2A8;--brand:#1F6B52;--primary:#1F6B52;--primary-hover:#185843;--primary-soft:#E5F1EC;--primary-highlight:#CFE5DA;--cat-stage:#A23B4A;--cat-exhibit:#3D4ACC;--cat-festival:#B06F0F;--cat-etc:#5E5850;--shadow-tile:0 2px 8px rgba(38,34,30,.08);--status-open:#2E5AAC;--status-open-soft:#EAF0FB;--status-soon:#8F5500;--status-soon-soft:#FFF3DC;--status-closed:#8C867D;--shadow-hover:0 2px 4px rgba(38,34,30,.04),0 8px 24px rgba(38,34,30,.08);--img-edge:inset 0 0 0 1px rgba(0,0,0,.06)}
body{margin:0;font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);letter-spacing:-0.01em}
a{color:inherit;text-decoration:none}
.btn-p{transition:background .2s ease-out}.btn-p:hover{background:var(--primary-hover)}
.pc .pimg{transition:transform .2s ease-out,box-shadow .2s ease-out}.pc:hover .pimg{transform:scale(1.02);box-shadow:var(--shadow-hover),var(--img-edge)}.pc:hover h3{text-decoration:underline}
.mr{transition:background .2s ease-out}.mr:hover{background:var(--surface)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost:hover{text-decoration:underline}
.qt .qt-box{transition:background .25s ease-out,color .25s ease-out,transform .25s ease-out}.qt:hover .qt-box{background:var(--primary);color:#FFFFFF;transform:translateY(-2px)}.qt:hover .qt-label{color:var(--text);font-weight:600}.qt:focus-visible{outline:none}.qt:focus-visible .qt-box{outline:2px solid var(--text);outline-offset:3px}

@media (prefers-reduced-motion: reduce){.pc:hover .pimg{transform:none}}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div class="page" style="width: 100%; min-width: 1280px; min-height: 100vh; box-sizing: border-box; background: var(--bg); color: var(--text); display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; display: flex; align-items: center; gap: 56px; padding: 0 max(180px, calc((100% - 1080px) / 2)); background: var(--bg); border-bottom: 1px solid var(--line)">
<a href="home.html" style="font-size: 22px; font-weight: 800; letter-spacing: -0.03em; color: var(--brand)">모여봄</a>
<nav style="display: flex; gap: 32px; font-size: 16px; font-weight: 600">
<a href="home.html" style="height: 72px; box-sizing: border-box; display: flex; align-items: center; border-bottom: 2px solid var(--brand); color: var(--text)">홈</a>
<a href="#" style="height: 72px; box-sizing: border-box; display: flex; align-items: center; border-bottom: 2px solid transparent; color: var(--text-sub)">행사</a>
<a href="#" style="height: 72px; box-sizing: border-box; display: flex; align-items: center; border-bottom: 2px solid transparent; color: var(--text-sub)">모임</a>
<a href="home.html" style="height: 72px; box-sizing: border-box; display: flex; align-items: center; border-bottom: 2px solid transparent; color: var(--text-sub)">내 모임</a>
<a href="friends.html" style="height: 72px; box-sizing: border-box; display: flex; align-items: center; border-bottom: 2px solid transparent; color: var(--text-sub)">친구</a>
<a href="home.html" style="height: 72px; box-sizing: border-box; display: flex; align-items: center; border-bottom: 2px solid transparent; color: var(--text-sub)">마이</a>
</nav>
<span style="flex-grow: 1"></span>
<button aria-label="알림, 새 알림 있음" style="position: relative; width: 44px; height: 44px; border: none; background: transparent; color: var(--text-body); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span style="position: absolute; top: 10px; right: 11px; width: 7px; height: 7px; border-radius: 9999px; background: var(--brand)"></span></button>
<div style="width: 36px; height: 36px; border-radius: 9999px; background: var(--bg-muted)"></div>
</header>
<main style="width: 1080px; margin: 0 auto; padding: 48px 0 0; display: flex; flex-direction: column; gap: 80px">
<div style="display: flex; flex-direction: column; gap: 48px">
<section style="display: flex; align-items: flex-end; gap: 24px; padding-bottom: 20px; border-bottom: 1.5px solid var(--line-strong)">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 36px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">9월 28일 월요일</h1>
</div>
<div style="display: flex; gap: 28px; font-size: 14px; color: var(--text-body)">
<span>열려 있는 행사 <strong style="font-size: 18px; font-weight: 700; color: var(--text)">128</strong></span>
<span>모집 중인 모임 <strong style="font-size: 18px; font-weight: 700; color: var(--text)">34</strong></span>
</div>
</section>
<div style="display: flex; flex-direction: column; gap: 24px">
<div role="tablist" aria-label="홈 보기 방식" style="display: flex; align-items: center; gap: 32px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
<div style="height: 460px">
<sc-if value="{{isRec}}" hint-placeholder-val="{{true}}">
<section style="display: grid; grid-template-columns: 280px minmax(0, 1fr); column-gap: 48px; align-items: start">
<a class="pc" href="#" style="display: block">
<div class="pimg" style="position: relative; height: 373px; border-radius: 12px; overflow: hidden; background: #5B4A5E; box-shadow: var(--img-edge)">
<span style="position: absolute; top: 14px; left: 14px; height: 24px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 9999px; background: rgba(255,255,255,.92); color: var(--text); font-size: 12px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 9999px; background: var(--cat-stage)"></span>공연</span>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 22px; display: flex; flex-direction: column; gap: 6px; color: #F4F2EC"><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em">MUSICAL</span><span style="font-size: 28px; font-weight: 700; line-height: 1.2">여름밤의 정원</span></div>
<button aria-label="찜하기" style="position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 34px; height: 34px; border-radius: 9999px; background: rgba(255,255,255,.88); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></span></button>
</div>
</a>
<div style="display: flex; flex-direction: column; gap: 16px; padding-top: 4px">
<div style="display: flex; gap: 6px">
<span style="display: inline-flex; align-items: center; height: 22px; margin-right: 6px; color: var(--status-open); font-size: 14px; font-weight: 600">진행 중</span>
<span style="display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: 9999px; background: var(--bg-muted); color: var(--text-body); font-size: 12px; font-weight: 500">공연 · 뮤지컬</span>
</div>
<h2 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">여름밤의 정원</h2>
<span style="font-size: 14px; color: var(--text-body)">~11.09 · 종로구 대학로 · 평일 19:30 · 러닝타임 150분</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; color: var(--text-body)">
<span style="height: 36px; padding: 0 14px; display: flex; align-items: center; gap: 6px; border-radius: 9999px; background: var(--surface); border: 1px solid var(--line)"><strong style="font-weight: 700; color: var(--text)">취향</strong>뮤지컬</span>
<span style="height: 36px; padding: 0 14px; display: flex; align-items: center; gap: 6px; border-radius: 9999px; background: var(--surface); border: 1px solid var(--line)"><strong style="font-weight: 700; color: var(--text)">이력</strong>연극 모임</span>
<span style="height: 36px; padding: 0 14px; display: flex; align-items: center; gap: 6px; border-radius: 9999px; background: var(--surface); border: 1px solid var(--line)"><strong style="font-weight: 700; color: var(--text)">지역</strong>근처</span>
</div>
<span style="font-size: 14px; font-weight: 700; color: var(--text)">👥 이 행사로 열린 모임 5 <span style="font-weight: 400; color: var(--text-sub)">· 3개 모집 중</span></span>
<div style="display: flex; gap: 10px; margin-top: 8px">
<a class="btn-p" href="#" style="height: 52px; padding: 0 28px; display: flex; align-items: center; border-radius: 12px; background: var(--primary); color: #FFFFFF; font-size: 16px; font-weight: 700">이 행사 모임 보기</a>
<a href="#" style="height: 52px; padding: 0 24px; display: flex; align-items: center; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--text); font-size: 16px; font-weight: 600">행사 정보</a>
</div>
</div>
</section>
</sc-if>
<sc-if value="{{isMap}}" hint-placeholder-val="{{false}}">
<section aria-label="지도로 보기" style="height: 460px; display: grid; grid-template-columns: 340px minmax(0, 1fr); column-gap: 20px">
<div style="border-radius: 16px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column">
<div style="padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 15px; font-weight: 700">지도에 보이는 행사</span>
<span style="font-size: 14px; color: var(--text-sub)">6</span>
</div>
<sc-for list="{{mapList}}" as="e" hint-placeholder-count="6">
<a href="#" style="{{e.row}}">
<span style="width: 36px; height: 48px; flex-shrink: 0; border-radius: 6px; background: {{e.bg}}; box-shadow: var(--img-edge); display: block"></span>
<span style="min-width: 0; flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span class="one" style="font-size: 15px; font-weight: 600; color: var(--text)">{{e.title}}</span>
<span class="one" style="font-size: 13px; color: var(--text-body)">{{e.meta}}</span>
</span>
<span style="{{e.meetStyle}}">{{e.meet}}</span>
</a>
</sc-for>
</div>
<div style="position: relative; border-radius: 16px; overflow: hidden; background: #ECE9E1; box-shadow: var(--img-edge)">
<svg width="720" height="460" viewBox="0 0 720 460" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<rect x="430" y="40" width="150" height="90" rx="24" fill="#DCE6D3"></rect>
<rect x="60" y="380" width="120" height="60" rx="20" fill="#DCE6D3"></rect>
<path d="M-10 318 C 120 290, 230 356, 360 318 S 600 268, 730 300" stroke="#C9DCE6" stroke-width="34" fill="none"></path>
<path d="M0 150 L720 120" stroke="#FFFFFF" stroke-width="7" fill="none"></path>
<path d="M0 240 L720 220" stroke="#FFFFFF" stroke-width="5" fill="none"></path>
<path d="M200 0 L240 460" stroke="#FFFFFF" stroke-width="6" fill="none"></path>
<path d="M380 0 L360 460" stroke="#FFFFFF" stroke-width="7" fill="none"></path>
<path d="M560 0 L600 460" stroke="#FFFFFF" stroke-width="5" fill="none"></path>
<path d="M0 420 L720 400" stroke="#FFFFFF" stroke-width="5" fill="none"></path>
</svg>
<sc-for list="{{pins}}" as="p" hint-placeholder-count="6">
<span style="{{p.pos}}">
<span style="{{p.dot}}"><span style="width: 8px; height: 8px; border-radius: 9999px; background: #FFFFFF; display: block"></span></span>
<span style="{{p.badge}}">{{p.n}}</span>
</span>
</sc-for>
<div style="position: absolute; left: 356px; top: 44px; width: 250px; padding: 12px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-hover); display: flex; gap: 12px">
<span style="width: 48px; height: 64px; flex-shrink: 0; border-radius: 6px; background: #5B4A5E; box-shadow: var(--img-edge); display: block"></span>
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 15px; font-weight: 700">여름밤의 정원</span>
<span style="font-size: 13px; color: var(--text-body)">~11.09 · 대학로</span>
<a class="ghost" href="#" style="margin-top: 4px; font-size: 13px; font-weight: 700; color: var(--text)">이 행사로 열린 모임 5 ›</a>
</span>
</div>
<button style="position: absolute; top: 16px; right: 16px; height: 40px; padding: 0 14px; border: none; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-hover); color: var(--text); display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>현재 위치</button>
</div>
</section>
</sc-if>
<sc-if value="{{isCal}}" hint-placeholder-val="{{false}}">
<section aria-label="달력으로 보기" style="height: 460px; display: grid; grid-template-columns: 320px minmax(0, 1fr); column-gap: 32px">
<div style="padding: 20px; border-radius: 16px; background: var(--bg-muted); display: flex; flex-direction: column; gap: 14px">
<div role="radiogroup" aria-label="기간" style="display: flex; gap: 4px; padding: 4px; border-radius: 9999px; background: #E9E6DE">
<button role="radio" aria-checked="true" style="flex: 1; height: 36px; border: none; border-radius: 9999px; background: var(--surface); color: var(--text); font-family: inherit; font-size: 14px; font-weight: 700">오늘</button>
<button role="radio" aria-checked="false" style="flex: 1; height: 36px; border: none; border-radius: 9999px; background: transparent; color: var(--text-body); font-family: inherit; font-size: 14px; font-weight: 500">이번 주말</button>
<button role="radio" aria-checked="false" style="flex: 1; height: 36px; border: none; border-radius: 9999px; background: transparent; color: var(--text-body); font-family: inherit; font-size: 14px; font-weight: 500">기간 설정</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="이전 달" style="width: 36px; height: 36px; border: none; background: transparent; color: var(--text-body); font-size: 20px; font-family: inherit">‹</button>
<span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">2026.09</span>
<button aria-label="다음 달" style="width: 36px; height: 36px; border: none; background: transparent; color: var(--text-body); font-size: 20px; font-family: inherit">›</button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 13px; color: var(--text-sub); text-align: center">
<span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="32">
<div style="height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span style="{{d.num}}">{{d.label}}</span>
<span style="{{d.dot}}"></span>
</div>
</sc-for>
</div>
<span style="margin-top: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-sub)"><span style="width: 6px; height: 6px; border-radius: 9999px; background: var(--primary); display: block"></span>모임</span>
</div>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-size: 18px; font-weight: 700">9월 28일 월요일</span>
<span style="font-size: 14px; color: var(--text-sub)">행사 12 · 모임 5</span>
<span style="flex-grow: 1"></span>
<a class="ghost" href="#" style="font-size: 14px; font-weight: 600; color: var(--text)">이 날 행사 전체 ›</a>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{calPosters}}" as="p" hint-placeholder-count="4">
<a class="pc" href="#" style="display: flex; flex-direction: column; gap: 6px; color: var(--text)">
<div class="pimg" style="position: relative; height: 222px; border-radius: 12px; overflow: hidden; background: {{p.bg}}; box-shadow: var(--img-edge)">
<span style="position: absolute; top: 10px; left: 10px; height: 24px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 9999px; background: rgba(255,255,255,.92); color: var(--text); font-size: 12px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 9999px; background: {{p.cat}}"></span>{{p.type}}</span>
<span style="position: absolute; left: 14px; right: 14px; bottom: 14px; font-size: 17px; font-weight: 700; line-height: 1.2; color: {{p.ink}}">{{p.title}}</span>
</div>
<h3 class="one" style="margin: 4px 0 0; font-size: 16px; font-weight: 600; line-height: 1.4">{{p.title}}</h3>
<span style="font-size: 13px; color: var(--text-body)">{{p.meta}}</span>
<span style="{{p.meetStyle}}">{{p.meet}}</span>
</a>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<div style="flex-grow: 1; height: 3px; border-radius: 9999px; background: var(--line); overflow: hidden"><div style="width: 33%; height: 3px; background: var(--primary)"></div></div>
<span style="font-size: 14px; color: var(--text-sub); font-variant-numeric: tabular-nums">1 / 3</span>
<button aria-label="이전" style="width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 9999px; background: var(--surface); color: var(--text); font-family: inherit">‹</button>
<button aria-label="다음" style="width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 9999px; background: var(--surface); color: var(--text); font-family: inherit">›</button>
<button aria-label="자동 넘김 멈춤" style="width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 9999px; background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
</div>
</div>
</section>
</sc-if>
</div>
</div>
</div>
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--line)">
<h2 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.4; letter-spacing: -0.02em">이번 주 모임</h2>
<span style="font-size: 18px; font-weight: 500; color: var(--text-sub)">5</span>
<span style="flex-grow: 1"></span>
<a class="ghost" href="#" style="font-size: 15px; font-weight: 600; color: var(--text)">모임 전체 ›</a>
</div>
<div style="margin-top: 16px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{meetups}}" as="m" hint-placeholder-count="5">
<a class="pc" href="#" style="display: flex; flex-direction: column; gap: 8px; color: var(--text)">
<div class="pimg" style="position: relative; height: 262px; border-radius: 12px; overflow: hidden; background: {{m.bg}}; box-shadow: var(--img-edge)">
<span style="position: absolute; top: 12px; left: 12px; height: 24px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 9999px; background: rgba(255,255,255,.92); color: var(--text); font-size: 12px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 9999px; background: {{m.cat}}"></span>{{m.type}}</span>
<div style="{{m.posterText}}"><span style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em">{{m.eng}}</span><span style="font-size: 20px; font-weight: 700; line-height: 1.2">{{m.event}}</span></div>
<span style="{{m.closedVeil}}">마감된 모임</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 4px">
<span style="{{m.sb}}">{{m.st}}</span>
<span class="one" style="font-size: 13px; color: var(--text-sub)">{{m.kind}}</span>
</div>
<h3 class="clamp2" style="margin: 0; font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: -0.02em">{{m.title}}</h3>
<span class="one" style="font-size: 14px; font-weight: 500; color: var(--text)">{{m.event}}</span>

function get(path, scope){ return path.trim().split('.').reduce((o,k)=> (o==null?undefined:o[k]), scope); }
function interp(str, scope){
  const m = str.match(/^\s*\{\{([^}]+)\}\}\s*$/);
  if (m) return get(m[1], scope);
  return str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = get(p, scope); return v == null ? '' : v; });
}
function walk(node, scope){
  for (const child of Array.from(node.childNodes)) {
    if (child.nodeType === 3) { if (child.nodeValue.includes('{{')) child.nodeValue = interp(child.nodeValue, scope); continue; }

      continue;

    walk(child, scope);
  }

  const frag = tpl.content.cloneNode(true);

}
