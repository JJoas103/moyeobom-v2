<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모여봄 친구 메모</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css");
:root{--bg:#FBFAF7;--bg-muted:#F4F2EC;--surface:#FFFFFF;--line:#E6E1D7;--line-strong:#26221E;--text:#26221E;--text-body:#5E5850;--text-sub:#736D64;--text-disabled:#B8B2A8;--brand:#1F6B52;--primary:#1F6B52;--primary-hover:#185843;--primary-soft:#E5F1EC;--primary-highlight:#CFE5DA;--cat-stage:#A23B4A;--cat-exhibit:#3D4ACC;--cat-festival:#B06F0F;--cat-etc:#5E5850;--status-open:#2E5AAC;--status-soon:#8F5500;--status-closed:#8C867D;--shadow-hover:0 2px 4px rgba(38,34,30,.04),0 8px 24px rgba(38,34,30,.08);--img-edge:inset 0 0 0 1px rgba(0,0,0,.06)}
body{margin:0;font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);letter-spacing:-0.01em}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.btn-p{transition:background .2s ease-out}.btn-p:hover{background:var(--primary-hover)}
.pc .pimg{transition:transform .2s ease-out,box-shadow .2s ease-out}.pc:hover .pimg{transform:scale(1.02);box-shadow:var(--shadow-hover),var(--img-edge)}.pc:hover h3{text-decoration:underline}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost:hover{text-decoration:underline}
input{box-sizing:border-box;font-family:inherit}

@media (prefers-reduced-motion: reduce){.pc:hover .pimg{transform:none}}
</style>
</head>
<body>
<div class="page" style="width: 100%; min-width: 1280px; min-height: 100vh; box-sizing: border-box; background: var(--bg); color: var(--text); display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; display: flex; align-items: center; gap: 56px; padding: 0 max(180px, calc((100% - 1080px) / 2)); background: var(--bg); border-bottom: 1px solid var(--line)">
<a href="#" style="font-size: 22px; font-weight: 800; letter-spacing: -0.03em; color: var(--brand)">모여봄</a>
<nav style="display: flex; gap: 32px; font-size: 16px; font-weight: 600">
<a href="#" style="height: 72px; box-sizing: border-box; display: flex; align-items: center; border-bottom: 2px solid transparent; color: var(--text-sub)">홈</a>
<a href="#" style="height: 72px; box-sizing: border-box; display: flex; align-items: center; border-bottom: 2px solid transparent; color: var(--text-sub)">행사</a>
<a href="#" style="height: 72px; box-sizing: border-box; display: flex; align-items: center; border-bottom: 2px solid transparent; color: var(--text-sub)">모임</a>
<a href="#" style="height: 72px; box-sizing: border-box; display: flex; align-items: center; border-bottom: 2px solid transparent; color: var(--text-sub)">내 모임</a>
<a href="friends.html" style="height: 72px; box-sizing: border-box; display: flex; align-items: center; border-bottom: 2px solid var(--brand); color: var(--text)">친구</a>
<a href="#" style="height: 72px; box-sizing: border-box; display: flex; align-items: center; border-bottom: 2px solid transparent; color: var(--text-sub)">마이</a>
</nav>
<span style="flex-grow: 1"></span>
<button aria-label="알림, 새 알림 있음" style="position: relative; width: 44px; height: 44px; border: none; background: transparent; color: var(--text-body); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span style="position: absolute; top: 10px; right: 11px; width: 7px; height: 7px; border-radius: 9999px; background: var(--brand)"></span></button>
<div style="width: 36px; height: 36px; border-radius: 9999px; background: var(--bg-muted)"></div>
</header>
<main style="width: 1080px; margin: 0 auto; padding: 48px 0 80px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: flex-end; gap: 32px; border-bottom: 1px solid var(--line)">
<h1 style="margin: 0 16px 10px 0; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">친구</h1>
<div role="tablist" style="display: flex; gap: 28px">
<a role="tab" aria-selected="true" href="friends.html" style="height: 44px; padding: 0 4px; border: none; border-bottom: 2px solid var(--text); background: transparent; color: var(--text); font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 6px">친구 <span style="font-size: 15px; font-weight: 500; color: var(--text-sub)">3</span></a>
<a role="tab" aria-selected="false" href="friends-requests.html" style="height: 44px; padding: 0 4px; border: none; border-bottom: 2px solid transparent; background: transparent; color: var(--text-sub); font-size: 17px; font-weight: 500; display: flex; align-items: center; gap: 6px">요청 <span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 9999px; background: var(--brand); color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span></a>
</div>
</div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 320px; column-gap: 40px; align-items: start">
<section style="display: flex; flex-direction: column">
<div style="position: relative; display: flex; align-items: center; gap: 16px; padding: 16px 4px; border-bottom: 1px solid var(--line)">
<span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 9999px; background: #9FB2A1; display: block"></span>
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0"><span style="font-size: 17px; font-weight: 700">무대뒤</span><span style="align-self: flex-start; max-width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px 12px; border-radius: 10px; background: var(--bg-muted); display: inline-flex; align-items: center; gap: 8px; color: var(--text-sub)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg><span class="one" style="font-size: 14px; color: var(--text-body)">2막 얘기 잘 통함 · 뮤지컬 좋아함</span></span></span>
<a href="chat-friend.html" style="height: 40px; padding: 0 16px; display: flex; align-items: center; gap: 6px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>1:1 채팅</a>
<button aria-label="무대뒤 메뉴" style="width: 40px; height: 40px; border: none; border-radius: 10px; background: transparent; color: var(--text-body); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></button>

</div>
<div style="position: relative; display: flex; align-items: center; gap: 16px; padding: 16px 4px; border-bottom: 1px solid var(--line)">
<span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 9999px; background: #A9B7C6; display: block"></span>
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0"><span style="font-size: 17px; font-weight: 700">오후네시</span></span>
<a href="chat-friend.html" style="height: 40px; padding: 0 16px; display: flex; align-items: center; gap: 6px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>1:1 채팅</a>
<button aria-label="오후네시 메뉴" style="width: 40px; height: 40px; border: none; border-radius: 10px; background: transparent; color: var(--text-body); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></button>

</div>
<div style="position: relative; display: flex; align-items: center; gap: 16px; padding: 16px 4px; border-bottom: 1px solid var(--line)">
<span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 9999px; background: #C9A66B; display: block"></span>
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0"><span style="font-size: 17px; font-weight: 700">달빛산책</span><span style="align-self: flex-start; max-width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px 12px; border-radius: 10px; background: var(--bg-muted); display: inline-flex; align-items: center; gap: 8px; color: var(--text-sub)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg><span class="one" style="font-size: 14px; color: var(--text-body)">다음 전시 같이 보기로 함</span></span></span>
<a href="chat-friend.html" style="height: 40px; padding: 0 16px; display: flex; align-items: center; gap: 6px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>1:1 채팅</a>
<button aria-label="달빛산책 메뉴" style="width: 40px; height: 40px; border: none; border-radius: 10px; background: transparent; color: var(--text-body); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></button>

</div>
</section>
<aside style="padding: 24px; border-radius: 16px; background: var(--bg-muted); display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 15px; font-weight: 700">친구는 이렇게 생겨요</span>
<ol style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.55; color: var(--text-body)">
<li>모임이 끝나면 평가에서<br>'또 만나고 싶어요'를 골라요</li>
<li>서로 골랐다면<br>'요청' 탭에서 친구 요청을 보내요</li>
<li>상대가 수락하면 친구가 되고<br>1:1 채팅이 열려요</li>
</ol>
</aside>
</div>
</main><div style="position: fixed; inset: 0; z-index: 10; background: rgba(38,34,30,.32); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-label="메모 설정" style="width: 400px; padding: 24px; box-sizing: border-box; border-radius: 16px; background: var(--surface); box-shadow: 0 16px 48px rgba(38,34,30,.2); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 9999px; background: #A9B7C6; display: block"></span><span style="font-size: 17px; font-weight: 700; flex-grow: 1">오후네시 메모</span><button aria-label="닫기" style="width: 36px; height: 36px; border: none; border-radius: 10px; background: transparent; color: var(--text-body); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<label style="display: flex; flex-direction: column; gap: 6px">
<input value="편지 결말 해석이 나랑 비슷함" style="width: 100%; height: 48px; padding: 0 14px; border: 1.5px solid var(--text); border-radius: 10px; background: var(--surface); color: var(--text); font-size: 15px">
<span style="align-self: flex-end; font-size: 12px; color: var(--text-sub); font-variant-numeric: tabular-nums">16 / 30</span>
</label>
<div style="display: flex; justify-content: flex-end; gap: 8px">
<button style="height: 44px; padding: 0 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); font-size: 15px; font-weight: 600">취소</button>
<button class="btn-p" style="height: 44px; padding: 0 24px; border: none; border-radius: 10px; background: var(--primary); color: #FFFFFF; font-size: 15px; font-weight: 700">저장</button>
</div>
</div>
</div>
<footer style="margin-top: auto; padding: 32px max(180px, calc((100% - 1080px) / 2)); border-top: 1px solid var(--line); display: flex; gap: 24px; font-size: 13px; color: var(--text-sub)">
<span style="font-weight: 800; color: var(--text)">모여봄</span>
<span>행사 정보 · KOPIS · KOBIS · 서울시 문화행사 정보</span>
<span style="flex-grow: 1"></span>
<span>대학 팀 프로젝트</span>
</footer>
</div>
</body>
</html>
